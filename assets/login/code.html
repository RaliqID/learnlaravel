<style>
        .input-underline {
            border-bottom: 1px solid theme('colors.outline-variant');
            transition: border-color 0.2s ease;
        }
        .input-underline:focus-within {
            border-bottom-color: theme('colors.primary');
        }
        .input-field:focus {
            outline: none;
            box-shadow: none;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row overflow-hidden font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Left Side: Cinematic Abstract Visual -->
<div class="hidden md:block w-1/2 relative bg-surface-container-lowest overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center w-full h-full opacity-60" data-alt="A cinematic, slow-moving abstract visualization suggesting data flow or light trails. The scene is deeply moody, heavily utilizing the brand's sophisticated primary blue tones against a dark charcoal canvas. Soft, glowing vectors of light undulate gracefully, evoking a high-end digital publication's sense of interconnected information. The lighting is low-key, dramatic, and emphasizes the sleek, premium minimalist aesthetic of modern editorial design." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAsDR8hpsmv1u6NAvsbXM2WnFm-bqlb0z6dr1ReTPWYhGZZ4MnOV32cKT94S0AYD8IcuX7UOTrgyKz4tJdUtmnAR7sz0drUQC3w5IJt2ZynopWv32ENP871T131AlDUCAgBa7DJvYCUGqxvOj3A8OI_YKQAdRDQ36JhU4lI7D6-mR2ADWWKtqSD0n1Z6RNjCqJN1zBhOmx-c93qkHDWopsejv1q19PkgazxPug_XwMmw-BAw9YbDI2M')"></div>
<div class="absolute inset-0 bg-gradient-to-r from-background/40 to-background"></div>
<div class="absolute top-margin-desktop left-margin-desktop z-10">
<h1 class="font-display text-article-title-lg text-on-background flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">newspaper</span>
                LaraNews
            </h1>
</div>
</div>
<!-- Right Side: Minimal Login Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-background relative z-10">
<div class="w-full max-w-[400px]">
<!-- Mobile Logo -->
<div class="md:hidden mb-12">
<h1 class="font-display text-article-title-mobile text-on-background flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">newspaper</span>
                    LaraNews
                </h1>
</div>
<div class="mb-12">
<h2 class="font-page-title-mobile md:font-page-title text-page-title-mobile md:text-page-title text-on-background mb-4">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue to your editorial dashboard.</p>
</div>
<form class="space-y-stack-lg">
<!-- Email Input -->
<div class="relative input-underline">
<label class="font-metadata text-metadata text-on-surface-variant block mb-1" for="email">Email address</label>
<input class="input-field w-full bg-transparent border-0 p-0 py-2 text-on-background font-body-lg focus:ring-0 placeholder:text-outline" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative input-underline">
<div class="flex justify-between items-end mb-1">
<label class="font-metadata text-metadata text-on-surface-variant block" for="password">Password</label>
<a class="font-metadata text-metadata text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="flex items-center">
<input class="input-field w-full bg-transparent border-0 p-0 py-2 text-on-background font-body-lg focus:ring-0 placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="text-on-surface-variant hover:text-on-surface transition-colors p-2" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-sm" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<div class="pt-stack-md">
<button class="w-full bg-primary-container text-on-primary-container font-label text-label py-4 px-6 hover:bg-primary-fixed-dim transition-colors duration-300 flex justify-center items-center gap-2" type="submit">
                        Sign in
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-stack-lg text-center">
<p class="font-metadata text-metadata text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary hover:text-primary-fixed-dim transition-colors ml-1" href="#">Create account</a>
</p>
</div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
